[project]
name = "ezidatic-backend"
version = "0.1.0"
description = "Ezidatic — extensible AI data analyst platform (backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = [
  "E501",  # line-length handled by black
  "B008",  # `Depends(...)` in default args is the canonical FastAPI pattern
  "N803",  # `X` arg name is the sklearn convention for feature matrices
  "N806",  # `X` / `Session` local-var caps follow sklearn/SQLAlchemy idioms
  "B905",  # `zip()` strict= adds noise inside guaranteed-aligned iterators
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
